name: Tests relai
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-node:
    name: Relai sur Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Préparation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Ouvrir la branche
        uses: actions/checkout@v7

      - name: Installer
        run: pnpm install --lockfile=false

      - name: Vérifier les tests
        run: pnpm test

      - name: Envoyer couverture à Codecov
        uses: codecov/codecov-action@v7

  test-navig:
    name: Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Préparation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Ouvrir la branche
        uses: actions/checkout@v7

      - name: Installer
        run: pnpm install --lockfile=false

      - name: Vérifier les tests
        run: pnpm test:navig

      - name: Envoyer couverture à Codecov
        uses: codecov/codecov-action@v7
